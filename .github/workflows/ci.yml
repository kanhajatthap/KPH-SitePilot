name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-plugin:
    name: WordPress Connector Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint every plugin file
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Connector protocol parity (PHP ↔ TS fixtures)
        run: php wordpress/kph-sitepilot-connector/tests/test-protocol.php

      - name: Connector static checks
        run: php wordpress/kph-sitepilot-connector/tests/test-plugin.php

      - name: Restricted file engine (isolated filesystem, not a live WordPress site)
        run: |
          php wordpress/kph-sitepilot-connector/tests/test-restricted-files.php
          KPH_TEST_MODE=disabled php wordpress/kph-sitepilot-connector/tests/test-restricted-files.php
          KPH_TEST_MODE=mods-disabled php wordpress/kph-sitepilot-connector/tests/test-restricted-files.php

      - name: Legacy bridge static checks
        run: php wordpress/wp-agent-bridge/tests/test-plugin.php

      - name: Build installable connector ZIP
        run: bash scripts/build-connector-zip.sh

      - name: Upload connector ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kph-sitepilot-connector
          path: dist/kph-sitepilot-connector-*.zip
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Typecheck
        run: pnpm typecheck

      - name: Edge Functions Typecheck
        run: pnpm typecheck:edge

      - name: Monorepo Lint
        run: pnpm lint

      - name: Secret Leak Prevention & Security Audit
        run: |
          echo "Scanning for accidental secrets or .env file commits..."
          ! git ls-files | grep -E "^\.env(\.local)?$"
          echo "Checking production dependency vulnerabilities..."
          pnpm audit --prod --audit-level high || echo "Audit warnings logged for review"

      - name: Monorepo Unit & Security Tests (Zero-Quota Mock Mode)
        # Use the Turbo pipeline, not `pnpm -r test`: turbo's `test` task
        # declares `dependsOn: ["^build"]`, so workspace packages are built
        # before their tests import them. Running recursive pnpm directly
        # fails on a clean checkout because `dist/` does not exist yet.
        run: pnpm test
        env:
          NODE_ENV: test
          AI_PROVIDER: mock

      - name: Monorepo Build
        run: pnpm build
