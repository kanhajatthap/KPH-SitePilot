# Generated fixture directory only; never publishes a host port or mounts Docker socket.
services:
  db:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: fixture
      MYSQL_USER: fixture
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets: [db_password, root_password]
    tmpfs: [/var/lib/mysql]
    networks: [isolated]
    healthcheck:
      # The temporary initialization server is socket-only (--skip-networking).
      # TCP avoids declaring readiness before fixture DB/user creation finishes.
      test: [CMD, mysqladmin, --protocol=TCP, --host=127.0.0.1, ping, --silent]
      interval: 2s
      timeout: 2s
      retries: 45
  php:
    build: .
    user: "${FIXTURE_UID}:${FIXTURE_GID}"
    volumes:
      - "${FIXTURE_DIR}/site:/fixture/site"
      - "${FIXTURE_DIR}/db-password:/fixture/db-password:ro"
      - "${FIXTURE_DIR}/install.php:/fixture/install.php:ro"
      - "${FIXTURE_DIR}/runtime:/fixture/runtime"
    networks: [isolated]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: nginx:1.28.0-alpine
    user: "${FIXTURE_UID}:${FIXTURE_GID}"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - "${FIXTURE_DIR}/site:/fixture/site:ro"
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    networks: [isolated]
    depends_on: [php]
  runner:
    image: node:22.16.0-bookworm-slim
    user: "${FIXTURE_UID}:${FIXTURE_GID}"
    working_dir: /workspace
    entrypoint: [node, tests/wordpress/http/phases.mjs]
    volumes:
      - "${FIXTURE_DIR}:/fixture"
      - "${REPO_DIR}:/workspace:ro"
    networks: [isolated]
    profiles: [test]
networks:
  isolated: {internal: true}
secrets:
  db_password: {file: "${FIXTURE_DIR}/db-password"}
  root_password: {file: "${FIXTURE_DIR}/root-password"}
